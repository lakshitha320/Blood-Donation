version: '3.8'

services:
  donor-db:
    image: mongo:latest
    container_name: donor_db
    ports:
      - "27017:27017"
    volumes:
      - donor_db_data:/data/db

  donor-service:
    build: .
    container_name: donor_service
    ports:
      - "8082:8082"
    environment:
      - MONGO_URI=mongodb://donor-db:27017/donor_db
      - API_KEY=${API_KEY:-my-secret-api-key-12345}
    depends_on:
      - donor-db

volumes:
  donor_db_data:
