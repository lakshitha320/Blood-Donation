server:
  port: 8081

spring:
  application:
    name: donor-service
  datasource:
    url: jdbc:postgresql://localhost:5432/donor_service
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

api:
  key: "super-secret-api-key-donor-service"
