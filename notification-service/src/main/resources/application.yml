server:
  port: 8085

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/notification_db}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

api:
  security:
    key: ${API_KEY:my-secret-api-key-12345}

notification:
  mock-mode: ${NOTIFICATION_MOCK_MODE:true}   # true = log-only (no real SMTP/SMS provider needed for demo)
  sms:
    provider: ${SMS_PROVIDER:mock}            # swap to "twilio" etc. once real credentials are available

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
