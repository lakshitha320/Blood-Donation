server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/gateway_db

jwt:
  secret: BloodDonationSuperSecretKeyForJWTTokenGeneration2026!
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

gateway:
  security:
    api-key-header: X-API-KEY
    api-key-secret: blood_donation_secret_key_2026
  rate-limit:
    requests-per-minute: 60

services:
  donor:
    url: ${DONOR_SERVICE_URL:http://localhost:8081}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  request:
    url: ${REQUEST_SERVICE_URL:http://localhost:8083}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
